name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install -r "拓咸助手/咸鱼自动发布3d打印模型系统/requirements.txt"

      - name: Collector tests
        run: node "拓咸助手/咸鱼自动发布3d打印模型系统/tests/test_collector.mjs"

      - name: Publisher tests
        run: node "拓咸助手/咸鱼自动发布3d打印模型系统/tests/test_publisher.mjs"

      - name: Python pipeline tests
        run: python "拓咸助手/咸鱼自动发布3d打印模型系统/tests/test_pipeline.py"
